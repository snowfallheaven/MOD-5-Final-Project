<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Movies</title>
  <link rel="stylesheet" href="style1.css">
  <script src="https://kit.fontawesome.com/f191e4acef.js" crossorigin="anonymous"></script>
</head>
<body>
  <nav>
    <div class="logo">
      <img src="./assets/fes-logo.png" alt="" class="logo__img">
      <div class="logo__title">
        <span>Simplified</span>
        Filx
      </div>
    </div>
    <form class="search-form" id="searchForm">
      <div class="search-form__group">
        <input class="search-form__input" type="text" id="searchInput" placeholder="Search Movies..." required>
        <button class="search-form__btn" type="submit" aria-label="Search">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </form>
  </nav>
  <main>
    <div class="controls">
      <p id="resultsInfo" class="resultsInfo"></p>
      <div>
        <label for="sortSelect">Sort:</label>
        <select id="sortSelect">
          <option value="default">Default</option>
          <option value="a-z">A to Z</option>
          <option value="z-a">Z to A</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>
    </div>
    <div class="movies-grid" id="moviesGrid">
      <div class="movie-card">
        <img class="movie-card__img" src="" alt="">
        <h2 class="movie-card__title"></h2>
        <p class="movie-card__year"></p>
      </div>

      <div class="movie-card__poster-placeholder">
        Movie Poster
        <br>
        Not Available
      </div>
      
    </div>
  </main>
    <footer>
      <p>Created by Simplified.org. Powered by OMDBapi.</p>
    </footer>
  <script src="script1.js"></script>
</body>
</html>
